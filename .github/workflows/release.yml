name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify release tag
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION."
            exit 1
          fi

  test:
    name: Test on Python ${{ matrix.python-version }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install ".[tests]"

      - name: Run tests
        run: python -m pytest --quiet tests

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dLux
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  documentation:
    name: Publish release documentation
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install documentation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install git+https://github.com/squidfunk/mike.git

      - name: Verify PyPI release
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          EXPECTED_VERSION="${EXPECTED_VERSION#v}" python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          expected = os.environ["EXPECTED_VERSION"]
          for attempt in range(12):
              with urllib.request.urlopen("https://pypi.org/pypi/dLux/json") as response:
                  published = json.load(response)["info"]["version"]
              if published == expected:
                  print(f"Verified dLux {published} on PyPI.")
                  break
              if attempt == 11:
                  raise RuntimeError(
                      f"Expected dLux {expected} on PyPI, found {published}."
                  )
              time.sleep(10)
          PY

      - name: Build documentation
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python docs/scripts/generate_api_mds.py
          DLUX_DOCS_SITE_NAME="dLux v${VERSION}" zensical build --strict

      - name: Deploy release documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          VERSION="${GITHUB_REF_NAME#v}"
          DLUX_DOCS_SITE_NAME="dLux v${VERSION}" \
            mike deploy --config-file mkdocs.yml --push \
              --update-aliases "$VERSION" latest
          mike set-default --config-file mkdocs.yml --push latest

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6

      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## V${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## V[0-9]/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "dLux $GITHUB_REF_NAME" \
            --notes-file release-notes.md
