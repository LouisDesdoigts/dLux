theme:
  name: material
  icon:
    logo: material/telescope
    repo: fontawesome/brands/github  # Sets the logo to the GitHub 'cat'
  features:
    - navigation.top      # "Back to top" button
    - navigation.indexes   # Allows a section title to be its own page
    - content.code.copy   # Copy button on code blocks
    - content.action.edit   # Adds an "Edit this page" button
    - content.action.view   # Adds a "View source" button

  palette:
    # Light mode
    - scheme: default
      primary: amber
      accent: orange
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: amber
      accent: orange
      toggle:
        icon: lucide/moon
        name: Switch to light mode

site_name: !ENV [DLUX_DOCS_SITE_NAME, "dLux"]
docs_dir: docs/
site_description: Documentation for dLux.
site_author: Louis Desdoigts
site_url: https://louisdesdoigts.github.io/dlux/
repo_url: https://github.com/LouisDesdoigts/dlux
repo_name: louisdesdoigts/dlux
edit_uri: edit/main/docs/   # Directs where the "Edit" link points

# Notebook outputs contain bracketed JAX shapes and progress-bar text that look
# like unresolved link references. Invalid links and anchors remain validated.
validation:
  unresolved_references: false

strict: true # Prevent builds with warnings

plugins:
  - mkdocstrings:        # Auto-generate API docs from code
      handlers:
        python:
          options:
            docstring_style: "numpy"
            show_root_heading: true      # Highly recommended for module-level docs

markdown_extensions:
  - admonition           # Support for !!! note "Title" blocks
  - pymdownx.details     # Support for collapsible ??? note blocks
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:   # Allows including code snippets from files
      base_path: [".", "docs"] # Look in the root AND the docs folder
  - pymdownx.arithmatex: # Required for LaTeX math
      generic: true
  - toc:
      permalink: "¤"     # Clickable link next to headers
      toc_depth: 2
  - attr_list            # Required to resize/style images {: width=300}
  - md_in_html           # Allows using HTML tags inside Markdown


# MathJax setup for LaTeX rendering
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

extra:
  version:
    provider: mike  # Tells the UI: "Look for mike's version list"

# ===== Navigation =====
nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorials:
    - Find a Tutorial:          tutorials/index.md
    - Learn dLux:
      - Systems, Sources & Images: optical_systems.md
      - A Basic Overview:         phase_retrieval.md
      - Building Apertures:       apertures.md
    - Inference & Design:
      - Instrumental Calibration: calibration.md
      - Phase Mask Design:        mask_design.md
      - Coronagraphs:             coronagraphs.md
    - Propagation Methods:
      - ABCD Fresnel:              abcd_fresnel.md
      - ASM Fresnel:               asm.md
      - Sparse Propagation:        sparse_propagation.md

  - API:
    - Overview: API/overview.md
    - Core API:
      - Overview: API/core/overview.md
      - Fields: API/core/fields.md
      - Grids: API/core/grids.md
      - Sources: API/core/sources.md
      - Systems: API/core/systems.md

    - Layers API:
      - Overview: API/layers/overview.md
      - Detector: API/layers/detector.md
      - Dynamic: API/layers/dynamic.md
      - Optical: API/layers/optical.md
      - Polarised: API/layers/polarised.md
      - Propagation: API/layers/propagation.md
      - Refractive: API/layers/refractive.md
      - Sparse: API/layers/sparse.md
      - Unified: API/layers/unified.md

    - Parametric API:
      - Overview: API/parametric/overview.md
      - Bases: API/parametric/bases.md
      - Parametrics: API/parametric/parametrics.md
      - Polynomials: API/parametric/polynomials.md
      - Refractive: API/parametric/refractive.md
      - Shapes: API/parametric/shapes.md

    - Utils API:
      - Overview: API/utils/overview.md
      - Abcd: API/utils/abcd.md
      - Apertures: API/utils/apertures.md
      - Array Ops: API/utils/array_ops.md
      - Coordinates: API/utils/coordinates.md
      - Fourier: API/utils/fourier.md
      - Geometry: API/utils/geometry.md
      - Helpers: API/utils/helpers.md
      - Interpolation: API/utils/interpolation.md
      - Math: API/utils/math.md
      - Misc: API/utils/misc.md
      - Norms: API/utils/norms.md
      - Optics: API/utils/optics.md
      - Polarisation: API/utils/polarisation.md
      - Polynomials: API/utils/polynomials.md
      - Propagation: API/utils/propagation.md
      - Source: API/utils/source.md
      - Units: API/utils/units.md
  - Publications: publications.md
  - Citation: citation.md
  - Change Log: changelog.md
  - Contributing: contributing.md
