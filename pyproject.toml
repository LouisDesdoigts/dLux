[project]
name = "dLux"
version = "0.16.0"
description = "Differentiable Physical Optics Propagation in Jax"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [{name = "Louis Desdoigts", email = "louis.desdoigts@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "python", 
    "jax", 
    "autodiff", 
    "optics", 
    "differentiable", 
    "diffraction", 
    "simulation", 
    "telescope", 
    "dLux"
]
dependencies = ["zodiax>=0.5", "abcdLux>=0.0.2", "interpax"]

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-cov",
]

dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "pre-commit",
    "zensical",
    "mkdocstrings-python"
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E = pycodestyle, F = Pyflakes, I = Isort (replaces your separate isort config)
select = ["E", "F", "I"]
ignore = [
    "E402", # Allow imports not at the top of the file
    "E731", # Allow lambda assignments
    "E741", # Allow ambiguous variable names (l, O, I)
    "F722", # Allow syntax errors in forward type annotations
    "I001", # Allow isort to manage imports without interference
]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: tests excluded from the default fast development loop",
]

[tool.coverage.run]
source = ["dLux"]
relative_files = true

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true
exclude_also = ["@(abc\\.)?abstractmethod"]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"
